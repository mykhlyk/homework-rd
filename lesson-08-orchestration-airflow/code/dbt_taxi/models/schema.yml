version: 2

models:
  - name: brz_yellow_trips
    description: >
      Bronze — типізована таблиця, явні CAST для всіх колонок.
      Матеріалізація incremental: одна партиція = одна доба (`pickup_date`),
      яку передає Airflow через `--vars '{"ds": ...}'`.
    columns:
      - name: tpep_pickup_datetime
        tests:
          - not_null
      - name: tpep_dropoff_datetime
        tests:
          - not_null
      - name: pu_location_id
        tests:
          - not_null
      - name: do_location_id
        tests:
          - not_null
      - name: pickup_date
        description: "Поле-партиція: за ним dbt робить delete+insert одного дня."
        tests:
          - not_null
      - name: _loaded_at
        description: "Коли партицію переписали востаннє (audit-колонка)."
        tests:
          - not_null
      - name: payment_type
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]

  - name: slr_yellow_trips
    description: >
      Silver — очищені поїздки (fare_amount >= 0, trip_distance >= 0, non-null).
      Теж incremental за `pickup_date`. Вхід для gld_fact_trip та gld_zone_revenue.
    columns:
      - name: pickup_date
        tests:
          - not_null
      - name: pu_location_id
        tests:
          - relationships:
              arguments:
                to: ref('seed_taxi_zone')
                field: LocationID
              config:
                severity: warn

  - name: gld_zone_revenue
    description: >
      Gold — аналітичний mart: виручка по зонах із window functions за всю
      завантажену історію. Свідомо не incremental — перебудовується цілком.
