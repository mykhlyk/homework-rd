version: 2

models:
  - name: brz_yellow_trips
    description: >
      Bronze — типізована таблиця, явні CAST для всіх колонок.
      Відповідає DDL із ноутбука (секція 3), але без CHECK-обмежень —
      DQ-фільтрація відбувається у slr_yellow_trips.
    columns:
      - name: tpep_pickup_datetime
        tests:
          - not_null
      - name: tpep_dropoff_datetime
        tests:
          - not_null
      - name: pu_location_id
        tests:
          - not_null
      - name: do_location_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]

  - name: slr_yellow_trips
    description: >
      Silver view — очищені поїздки (fare_amount >= 0, trip_distance >= 0, non-null).
      Вхід для gld_fact_trip та gld_zone_revenue.
    columns:
      - name: pu_location_id
        tests:
          - relationships:
              arguments:
                to: ref('seed_taxi_zone')
                field: LocationID
              config:
                severity: warn

  - name: gld_zone_revenue
    description: >
      Gold — аналітичний mart: виручка по зонах із window functions.
      Агрегує slr → join з довідником → cumulative revenue + rank у borough.
